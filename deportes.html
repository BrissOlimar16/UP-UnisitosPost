<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="imagenes/logoUNSIS.png">
    <title>UP~UnsitosPost | Secciones</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <section class="seccion-principal">
            <h1 class="titulo-pagina" id="deportes-titulo">Deportes</h1>
            <p class="descripcion-pagina" id="deportes-descripcion">Únete a la acción deportiva. 
                Participa en nuestros torneos de basquetbol, fútbol y más. ¡Sé campeón!</p>
        </section>

        <div class="contenedor-tarjetas">
            <!-- Columna Izquierda -->
            <div class="columna-izquierda">
                <!-- Conferencias -->
                <div class="tarjeta">
                    <img src="imagenes/basquet.jpg" alt="Basquet" class="tarjeta-imagen">
                    <div class="tarjeta-contenido">
                        <h3 class="tarjeta-titulo">Basquetbol</h3>
                        <p class="tarjeta-texto">Torneos de basquetbol en la unsis</p>
                        <a href="previaDeportes.html" class="boton">Ver Más</a>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha -->
            <div class="columna-derecha">
                <!-- Jornadas -->
                <div class="tarjeta">
                    <img src="imagenes/fut.jpg" alt="Futbol" class="tarjeta-imagen">
                    <div class="tarjeta-contenido">
                        <h3 class="tarjeta-titulo">Futbol</h3>
                        <p class="tarjeta-texto">Actividades académicas y profesionales</p>
                        <a href="infoFutbol.html" class="boton">Ver Más</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script>
        // Cargar contenido dinámico de deportes
        document.addEventListener('DOMContentLoaded', function() {
            const data = getData().avisos.deportes;
            if (data) {
                document.getElementById('deportes-titulo').textContent = data.titulo;
                document.getElementById('deportes-descripcion').textContent = data.texto;
            }
        });
    </script>
</body>

</html>
