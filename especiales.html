<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/imagenes/logoUNSIS.png">
    <title>UP~UnsitosPost | Especiales</title>
    <link rel="stylesheet" href="styles.css">
  
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <section class="seccion-principal">
            <h1 class="titulo-pagina">Especiales</h1>
            <p class="descripcion-pagina">Contenido especial y destacado de la UNSIS</p>
        </section>

        <!-- Carrusel de imágenes SIN JavaScript -->
        <div class="carrusel-container">
            <!-- Radio buttons para controlar el carrusel -->
            <input type="radio" name="carrusel" id="slide1" class="carrusel-radio" checked>
            <input type="radio" name="carrusel" id="slide2" class="carrusel-radio">
            <input type="radio" name="carrusel" id="slide3" class="carrusel-radio">
            <input type="radio" name="carrusel" id="slide4" class="carrusel-radio">
            <input type="radio" name="carrusel" id="slide5" class="carrusel-radio">
            
            <!-- Slides del carrusel -->
            <div class="carrusel-slides">
                <!-- Slide 1 -->
                <div class="carrusel-slide">
                    <img id="carrusel-img-0" src="imagenes/inundacion.jpeg" alt="Evento especial UNSIS 1">
                </div>
                
                <!-- Slide 2 -->
                <div class="carrusel-slide">
                    <img id="carrusel-img-1" src="imagenes/bicicleta.jpeg" alt="Evento especial UNSIS 2">
                </div>
                
                <!-- Slide 3 -->
                <div class="carrusel-slide">
                    <img id="carrusel-img-2" src="imagenes/dormidos.jpeg" alt="Evento especial UNSIS 3">
                </div>
                
                <!-- Slide 4 -->
                <div class="carrusel-slide">
                    <img id="carrusel-img-3" src="imagenes/imagen5 (3).jpg" alt="Evento especial UNSIS 4">
                </div>
                
                <!-- Slide 5 -->
                <div class="carrusel-slide">
                    <img id="carrusel-img-4" src="imagenes/imagen5 (4).jpg" alt="Evento especial UNSIS 5">
                </div>
            </div>
            
            <!-- Controles del carrusel (puntos) -->
            <div class="carrusel-controls">
                <label for="slide1" class="carrusel-dot"></label>
                <label for="slide2" class="carrusel-dot"></label>
                <label for="slide3" class="carrusel-dot"></label>
                <label for="slide4" class="carrusel-dot"></label>
                <label for="slide5" class="carrusel-dot"></label>
            </div>
        </div>

        

        <!-- Descripción de los especiales -->
        <section class="seccion-principal">
            <h2 class="titulo-pagina">Favoritos</h2>
            
            <div class="special-container">
                
                <div class="special-tarjeta">
                    <h3 id="especiales-subtitulo" class="tarjeta-titulo" style="text-align: justify;">Inundación</h3>
                    <img id="especiales-imagen" src="imagenes/inundacion.jpeg" alt="inundacion" class="special-imagen">
                    <div class="tarjeta-contenido">
                        <h5 id="especiales-autor" class="letra-autor"><i>Autor</i></h5>
                        <p id="especiales-texto" class="tarjeta-texto">Inundación por lluvias intensas en la UNSIS</p>
                        <!-- Icono de corazón -->
                       <div class="like-container">
                            <div id="like-heart" class="corazon-icono">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                                <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 
                                0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 
                                52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 
                                0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
                                </svg>
                            </div>
                            <span id="like-count">0</span>
                        </div>
                    </div>
                </div> 
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script> 
</body>
</html>
